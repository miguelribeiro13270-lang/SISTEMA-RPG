<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Missão Real — transforme tarefas do dia a dia em missões de jogo.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Missão Real</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <span class="eyebrow">MISSÃO REAL</span>
        <h1>Seu dia. Suas quests.</h1>
      </div>
      <button id="installBtn" class="icon-btn" hidden aria-label="Instalar app">＋</button>
    </header>

    <main>
      <section id="home" class="screen active">
        <div class="hero card">
          <div class="level-row">
            <div class="avatar">⚔️</div>
            <div class="level-info">
              <div class="muted">NÍVEL <span id="level">1</span></div>
              <strong id="rank">Novato</strong>
            </div>
            <div class="xp-text"><span id="xp">0</span> XP</div>
          </div>
          <div class="xpbar"><div id="xpFill"></div></div>
          <small id="xpNext">0 / 100 XP para o próximo nível</small>
        </div>

        <div class="stats">
          <div class="stat card"><span>🔥</span><b id="streak">0</b><small>dias seguidos</small></div>
          <div class="stat card"><span>🏆</span><b id="completed">0</b><small>missões feitas</small></div>
          <div class="stat card"><span>⭐</span><b id="totalXp">0</b><small>XP total</small></div>
        </div>

        <div class="section-head"><h2>Missões de hoje</h2><span id="todayLabel"></span></div>
        <div id="todayMissions" class="missions"></div>
      </section>

      <section id="quests" class="screen">
        <div class="section-head"><h2>Quests</h2><button id="addQuestBtn" class="small-btn">+ Nova</button></div>
        <div class="filters">
          <button class="filter active" data-cat="Todas">Todas</button>
          <button class="filter" data-cat="Corpo">⚔️ Corpo</button>
          <button class="filter" data-cat="Mente">📚 Mente</button>
          <button class="filter" data-cat="Casa">🏠 Casa</button>
          <button class="filter" data-cat="Vida">💰 Vida</button>
          <button class="filter" data-cat="Pessoal">🎯 Pessoal</button>
        </div>
        <div id="allMissions" class="missions"></div>
      </section>

      <section id="achievements" class="screen">
        <h2>Conquistas</h2>
        <div id="achievementsList" class="achievements"></div>
      </section>

      <section id="profile" class="screen">
        <div class="profile card">
          <div class="avatar big">⚔️</div>
          <h2 id="profileRank">Novato</h2>
          <p class="muted">Continue cumprindo suas missões para evoluir.</p>
          <div class="profile-grid">
            <div><b id="pLevel">1</b><span>Nível</span></div>
            <div><b id="pXp">0</b><span>XP</span></div>
            <div><b id="pCompleted">0</b><span>Missões</span></div>
          </div>
        </div>
        <button id="resetBtn" class="danger">Resetar progresso</button>
      </section>
    </main>

    <nav class="nav">
      <button class="nav-item active" data-screen="home">🏠<span>Início</span></button>
      <button class="nav-item" data-screen="quests">⚔️<span>Quests</span></button>
      <button class="nav-item" data-screen="achievements">🏆<span>Conquistas</span></button>
      <button class="nav-item" data-screen="profile">👤<span>Perfil</span></button>
    </nav>
  </div>

  <dialog id="questDialog">
    <form method="dialog" id="questForm">
      <h2>Nova missão</h2>
      <label>Nome <input id="qName" required maxlength="50" placeholder="Ex.: Ler 20 minutos"></label>
      <label>Categoria
        <select id="qCat">
          <option>Corpo</option><option>Mente</option><option>Casa</option><option>Vida</option><option>Pessoal</option>
        </select>
      </label>
      <label>XP <input id="qXp" type="number" min="1" max="500" value="20" required></label>
      <div class="dialog-actions">
        <button type="button" id="cancelDialog" class="ghost">Cancelar</button>
        <button class="primary">Criar missão</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
