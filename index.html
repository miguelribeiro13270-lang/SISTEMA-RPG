<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Missão Real</title>
</head>
<body>
<header class="top">
  <div>
    <div class="brand">⚔️ MISSÃO REAL</div>
    <div class="subtitle">Transforme sua rotina em uma aventura.</div>
  </div>
  <button id="installBtn" class="small-btn hidden">Instalar</button>
</header>

<main>
<section id="home" class="screen active">
  <div class="hero card">
    <div id="homeAvatar" class="avatar-wrap"></div>
    <div class="hero-info">
      <div id="rank" class="rank">Novato</div>
      <h1 id="level">Nível 1</h1>
      <div class="xpbar"><div id="xpFill"></div></div>
      <small id="xpText">0 / 100 XP</small>
    </div>
  </div>

  <div class="stats grid3">
    <div class="card stat"><b id="streak">0</b><span>🔥 Sequência</span></div>
    <div class="card stat"><b id="completed">0</b><span>⚔️ Missões</span></div>
    <div class="card stat"><b id="totalXp">0</b><span>⭐ XP total</span></div>
  </div>

  <div class="section-title"><h2>Missões de hoje</h2><button id="goQuests" class="link-btn">Ver todas</button></div>
  <div id="homeMissions" class="list"></div>
</section>

<section id="quests" class="screen">
  <div class="section-title"><h2>⚔️ Missões</h2><button id="addQuest" class="primary">+ Criar</button></div>
  <div id="cats" class="chips"></div>
  <div id="questList" class="list"></div>
</section>

<section id="achievements" class="screen">
  <h2>🏆 Conquistas</h2>
  <div id="achievementList" class="list"></div>
</section>

<section id="profile" class="screen">
  <h2>👤 Personagem</h2>
  <div class="card profile-card">
    <div id="profileAvatar" class="avatar-wrap large"></div>
    <div>
      <div id="profileRank" class="rank">Novato</div>
      <h2 id="profileName">Aventureiro</h2>
      <p class="muted">Personalize seu personagem do seu jeito.</p>
    </div>
  </div>
  <button id="customizeBtn" class="primary full">🎨 Personalizar personagem</button>
  <div class="card profile-stats">
    <div><span>Nível</span><b id="profileLevel">1</b></div>
    <div><span>XP</span><b id="profileXp">0</b></div>
    <div><span>Missões</span><b id="profileCompleted">0</b></div>
  </div>
  <button id="resetBtn" class="danger full">Resetar progresso</button>
</section>
</main>

<nav class="nav">
  <button data-screen="home" class="nav-btn active">🏠<span>Início</span></button>
  <button data-screen="quests" class="nav-btn">⚔️<span>Missões</span></button>
  <button data-screen="achievements" class="nav-btn">🏆<span>Conquistas</span></button>
  <button data-screen="profile" class="nav-btn">👤<span>Personagem</span></button>
</nav>

<dialog id="questDialog">
  <form method="dialog" id="questForm" class="dialog">
    <h2>Nova missão</h2>
    <input id="questName" required maxlength="50" placeholder="Nome da missão">
    <select id="questCat">
      <option>Corpo</option><option>Mente</option><option>Casa</option><option>Vida</option><option>Pessoal</option>
    </select>
    <input id="questXp" type="number" min="1" max="500" value="20" placeholder="XP">
    <div class="actions"><button value="cancel" class="secondary">Cancelar</button><button value="default" class="primary">Criar</button></div>
  </form>
</dialog>

<dialog id="avatarDialog">
  <form method="dialog" id="avatarForm" class="dialog avatar-dialog">
    <div class="section-title"><h2>🎨 Personalizar</h2><button value="cancel" class="icon-btn">✕</button></div>
    <div id="editorPreview" class="editor-preview"></div>

    <label>👤 Pele
      <div class="swatches" id="skinOptions"></div>
    </label>
    <label>💇 Cabelo
      <select id="hairStyle">
        <option value="short">Curto</option>
        <option value="spiky">Arrepiado</option>
        <option value="long">Longo</option>
        <option value="none">Sem cabelo</option>
      </select>
    </label>
    <label>🎨 Cor do cabelo
      <input id="hairColor" type="color" value="#1f2937">
    </label>
    <label>👕 Camisa
      <input id="shirtColor" type="color" value="#2563eb">
    </label>
    <label>👖 Calça
      <input id="pantsColor" type="color" value="#334155">
    </label>
    <label>👟 Tênis
      <input id="shoeColor" type="color" value="#f8fafc">
    </label>
    <label>✨ Acessório
      <select id="accessory">
        <option value="none">Nenhum</option>
        <option value="bandana">Bandana</option>
        <option value="glasses">Óculos</option>
        <option value="scarf">Cachecol</option>
        <option value="crown">Coroa</option>
      </select>
    </label>
    <div class="actions"><button value="cancel" class="secondary">Cancelar</button><button id="saveAvatar" value="default" class="primary">Salvar personagem</button></div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
